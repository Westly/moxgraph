<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="300" viewBox="0 0 1050 300" role="img" aria-label="Three original Moxgraph logo concepts" style="color:#176451"><rect width="1050" height="300" fill="#f5f6f2"/><g transform="translate(25 25)"><rect width="325" height="250" rx="12" fill="white"/><g transform="translate(125 28)" color="#176451"><defs><mask id="nib"><rect width="64" height="64" fill="white"/><path d="m25 41 10-11" stroke="black" stroke-width="2"/><circle cx="36" cy="29" r="2.5" fill="black"/></mask></defs><rect x="10" y="6" width="40" height="52" rx="7" fill="none" stroke="currentColor" stroke-width="4"/><path d="m24 41 5-16 10-5 5 10-10 12-10-1Z" fill="currentColor" mask="url(#nib)"/></g><text x="22" y="142" font-family="Segoe UI, sans-serif" font-size="18" font-weight="600" fill="#172f35">01 / Card &amp; nib — selected</text><text x="22" y="179" font-family="Segoe UI, sans-serif" font-size="12" fill="#56676b">A clear link between a card and its artist.</text></g><g transform="translate(370 25)"><rect width="325" height="250" rx="12" fill="white"/><g transform="translate(125 28)" color="#176451"><rect x="10" y="6" width="40" height="52" rx="7" fill="none" stroke="currentColor" stroke-width="4"/><path d="m21 42 10-18 12 16" fill="none" stroke="currentColor" stroke-width="3"/><g fill="currentColor"><circle cx="21" cy="42" r="4"/><circle cx="31" cy="24" r="4"/><circle cx="43" cy="40" r="4"/></g></g><text x="22" y="142" font-family="Segoe UI, sans-serif" font-size="18" font-weight="600" fill="#172f35">02 / Connected cards</text><text x="22" y="179" font-family="Segoe UI, sans-serif" font-size="12" fill="#56676b">A graph of cards, people and connections.</text></g><g transform="translate(715 25)"><rect width="325" height="250" rx="12" fill="white"/><g transform="translate(125 28)" color="#176451"><rect x="10" y="6" width="40" height="52" rx="7" fill="none" stroke="currentColor" stroke-width="4"/><path d="m18 43 5-20 5 15 9-15 1 20 7-3" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="22" y="142" font-family="Segoe UI, sans-serif" font-size="18" font-weight="600" fill="#172f35">03 / Signature</text><text x="22" y="179" font-family="Segoe UI, sans-serif" font-size="12" fill="#56676b">A loose monogram with a handwritten feel.</text></g></svg>
